<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tshirt Design | Morishe Peregrino</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #111; color: white; font-family: Arial, sans-serif; }
header { padding: 60px 20px; text-align: center; }
header h1 { font-size: 42px; margin-bottom: 10px; }
header p { color: #999; }
.gallery { width: 90%; max-width: 1400px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; padding-bottom: 80px; }
.gallery img { width: 100%; height: 300px; object-fit: cover; display: block; border-radius: 12px; cursor: zoom-in; transition: transform 0.3s ease, opacity 0.3s ease; }
.gallery img:hover { transform: scale(1.03); opacity: 0.85; }
.lightbox { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.96); justify-content: center; align-items: center; padding: 30px; overflow: hidden; }
.lightbox img { max-width: 95%; max-height: 95%; width: auto; height: auto; object-fit: contain; cursor: grab; transition: transform 0.15s ease; }
.lightbox img:active { cursor: grabbing; }
.close { position: fixed; top: 20px; right: 30px; color: white; font-size: 45px; background: none; border: none; cursor: pointer; z-index: 10000; }
.close:hover { opacity: 0.6; }
.zoom-controls { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10001; }
.zoom-controls button { width: 45px; height: 45px; border: none; border-radius: 8px; background: rgba(255,255,255,0.15); color: white; font-size: 24px; cursor: pointer; }
.zoom-controls button:hover { background: rgba(255,255,255,0.3); }
/* Discourage casual image saving without interfering with lightbox panning. */
.gallery img, .lightbox img { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
@media (max-width: 600px) { header h1 { font-size: 30px; } .gallery { width: 94%; grid-template-columns: 1fr; } .gallery img { height: 250px; } .lightbox { padding: 10px; } .zoom-controls { bottom: 15px; } }
</style>
</head>
<body>
<header><h1>Tshirt Design</h1><p>Tshirt Printing &amp; Designs.</p></header>
<div class="gallery">
<img src="images/tshirt design/SAMPLE 2.png" alt="T-shirt design 1" onclick="openImage(this.src)">
<img src="images/tshirt design/SAMPLE v3.png" alt="T-shirt design 2" onclick="openImage(this.src)">
<img src="images/tshirt design/received_1612521412115163.jpeg" alt="T-shirt design 3" onclick="openImage(this.src)">
<img src="images/tshirt design/rusher.jpg" alt="T-shirt design 4" onclick="openImage(this.src)">
<img src="images/tshirt design/shott.jpg" alt="T-shirt design 5" onclick="openImage(this.src)">
</div>
<div id="lightbox" class="lightbox" onclick="closeImage()">
<button class="close" onclick="closeImage()" aria-label="Close image">&times;</button>
<img id="lightbox-image" src="" alt="Full Resolution" onclick="event.stopPropagation()">
<div class="zoom-controls" onclick="event.stopPropagation()">
<button onclick="zoomIn()" aria-label="Zoom in">+</button>
<button onclick="zoomOut()" aria-label="Zoom out">−</button>
<button onclick="resetZoom()" aria-label="Reset zoom">⟳</button>
</div>
</div>
<script>
let zoomLevel = 1, posX = 0, posY = 0, isDragging = false, startX = 0, startY = 0;
const image = document.getElementById('lightbox-image');
const lightbox = document.getElementById('lightbox');
function openImage(imageSource) { image.src = imageSource; lightbox.style.display = 'flex'; resetZoom(); }
function closeImage() { lightbox.style.display = 'none'; image.src = ''; isDragging = false; resetZoom(); }
function zoomIn() { zoomLevel = Math.min(5, zoomLevel + 0.25); updateZoom(); }
function zoomOut() { zoomLevel = Math.max(1, zoomLevel - 0.25); if (zoomLevel === 1) { posX = 0; posY = 0; } updateZoom(); }
function resetZoom() { zoomLevel = 1; posX = 0; posY = 0; updateZoom(); }
function updateZoom() { image.style.transform = `translate(${posX}px, ${posY}px) scale(${zoomLevel})`; }
image.addEventListener('wheel', function(event) { event.preventDefault(); if (event.deltaY < 0) zoomIn(); else zoomOut(); }, { passive: false });
image.addEventListener('mousedown', function(event) { if (zoomLevel <= 1) return; event.preventDefault(); isDragging = true; startX = event.clientX - posX; startY = event.clientY - posY; image.style.transition = 'none'; });
document.addEventListener('mousemove', function(event) { if (!isDragging) return; posX = event.clientX - startX; posY = event.clientY - startY; updateZoom(); });
document.addEventListener('mouseup', function() { isDragging = false; image.style.transition = 'transform 0.15s ease'; });
/* Block native drag and image context menu; custom mouse panning still works. */
document.querySelectorAll('.gallery img, .lightbox img').forEach(function(img) {
  img.setAttribute('draggable', 'false');
  img.addEventListener('dragstart', function(event) { event.preventDefault(); });
  img.addEventListener('contextmenu', function(event) { event.preventDefault(); });
});
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') { if (lightbox.style.display === 'flex') closeImage(); return; }
  if (lightbox.style.display !== 'flex') return;
  if (event.key === '+' || event.key === '=') zoomIn();
  if (event.key === '-' || event.key === '_') zoomOut();
  if (event.key === '0') resetZoom();
});
</script>
</body>
</html>
