<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Game Assets | Morishe Peregrino</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #111; color: white; font-family: Arial, sans-serif; }
header { padding: 60px 20px; text-align: center; }
header h1 { font-size: 42px; margin-bottom: 10px; }
header p { color: #999; }
.gallery { width: 90%; max-width: 1400px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; padding-bottom: 80px; }
.gallery img { width: 100%; height: 300px; object-fit: cover; display: block; border-radius: 12px; cursor: zoom-in; transition: transform .3s ease, opacity .3s ease; }
.gallery img:hover { transform: scale(1.03); opacity: .85; }
/* Discourage casual image saving while keeping zoom/pan working. */
.gallery img, .lightbox img { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
.lightbox { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.96); justify-content: center; align-items: center; padding: 30px; overflow: hidden; }
.lightbox img { max-width: 95%; max-height: 95%; width: auto; height: auto; object-fit: contain; cursor: grab; transition: transform .15s ease; }
.lightbox img:active { cursor: grabbing; }
.close { position: fixed; top: 20px; right: 30px; color: white; font-size: 45px; background: none; border: none; cursor: pointer; z-index: 10000; }
.close:hover { opacity: .6; }
.zoom-controls { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10001; }
.zoom-controls button { width: 45px; height: 45px; border: none; border-radius: 8px; background: rgba(255,255,255,.15); color: white; font-size: 24px; cursor: pointer; }
.zoom-controls button:hover { background: rgba(255,255,255,.3); }
@media(max-width:600px) { header h1 { font-size:30px; } .gallery { width:94%; grid-template-columns:1fr; } .gallery img { height:250px; } .lightbox { padding:10px; } .zoom-controls { bottom:15px; } }
</style>
</head>
<body>
<header><h1>3D Game Assets</h1><p>Modeling, Texture, Rigging &amp; Animation.</p></header>
<div class="gallery">
<img src="images/3D Game asset/MOUNTAIN2.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
<img src="images/3D Game asset/perfume_3.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
<img src="images/3D Game asset/practice 2.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
<img src="images/3D Game asset/practice.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
<img src="images/3D Game asset/untitled.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
<img src="images/3D Game asset/Chilies.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
<img src="images/3D Game asset/Dynamite.png" alt="Center Window" onclick="openImage(this.src)" draggable="false">
</div>
<div id="lightbox" class="lightbox" onclick="closeImage()">
<button class="close" onclick="closeImage()" aria-label="Close image">&times;</button>
<img id="lightbox-image" src="" alt="Full Resolution" onclick="event.stopPropagation()" draggable="false">
<div class="zoom-controls" onclick="event.stopPropagation()">
<button onclick="zoomIn()" aria-label="Zoom in">+</button>
<button onclick="zoomOut()" aria-label="Zoom out">−</button>
<button onclick="resetZoom()" aria-label="Reset zoom">⟳</button>
</div>
</div>
<script>
let zoomLevel = 1, posX = 0, posY = 0, isDragging = false, startX = 0, startY = 0;
const image = document.getElementById('lightbox-image');
function openImage(imageSource) {
  image.src = imageSource;
  document.getElementById('lightbox').style.display = 'flex';
  resetZoom();
}
function closeImage() {
  document.getElementById('lightbox').style.display = 'none';
  image.src = '';
  isDragging = false;
  resetZoom();
}
function zoomIn() { zoomLevel = Math.min(5, zoomLevel + .25); updateZoom(); }
function zoomOut() {
  zoomLevel = Math.max(1, zoomLevel - .25);
  if (zoomLevel === 1) { posX = 0; posY = 0; }
  updateZoom();
}
function resetZoom() { zoomLevel = 1; posX = 0; posY = 0; updateZoom(); }
function updateZoom() { image.style.transform = `translate(${posX}px, ${posY}px) scale(${zoomLevel})`; }
image.addEventListener('wheel', function(event) {
  event.preventDefault();
  if (event.deltaY < 0) zoomIn(); else zoomOut();
}, {passive:false});
image.addEventListener('mousedown', function(event) {
  if (zoomLevel <= 1 || event.button !== 0) return;
  event.preventDefault();
  isDragging = true;
  startX = event.clientX - posX;
  startY = event.clientY - posY;
  image.style.transition = 'none';
});
document.addEventListener('mousemove', function(event) {
  if (!isDragging) return;
  posX = event.clientX - startX;
  posY = event.clientY - startY;
  updateZoom();
});
document.addEventListener('mouseup', function() {
  isDragging = false;
  image.style.transition = 'transform .15s ease';
});
// Block the image context menu and native drag without disabling lightbox panning.
document.querySelectorAll('.gallery img, .lightbox img').forEach(img => {
  img.addEventListener('contextmenu', event => event.preventDefault());
  img.addEventListener('dragstart', event => event.preventDefault());
});
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') closeImage();
  if (document.getElementById('lightbox').style.display !== 'flex') return;
  if (event.key === '+' || event.key === '=') zoomIn();
  if (event.key === '-' || event.key === '_') zoomOut();
  if (event.key === '0') resetZoom();
});
</script>
</body>
</html>
