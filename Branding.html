
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Branding | Morishe Peregrino</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================
   HEADER
========================= */

header {
    padding: 60px 20px;
    text-align: center;
}

header h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

header p {
    color: #999;
}


/* =========================
   GALLERY
========================= */

.gallery {

    width: 90%;
    max-width: 1400px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(350px, 1fr));

    gap: 25px;

    padding-bottom: 80px;
}


/* IMAGE CARD */

.gallery img {

    width: 100%;

    height: 300px;

    object-fit: cover;

    display: block;

    border-radius: 12px;

    cursor: zoom-in;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}


/* HOVER */

.gallery img:hover {

    transform: scale(1.03);

    opacity: 0.85;

}


/* =========================
   FULLSCREEN VIEWER
========================= */

.lightbox {

    display: none;

    position: fixed;

    z-index: 9999;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.96);

    justify-content: center;

    align-items: center;

    padding: 30px;

    overflow: hidden;

}


/* FULL RESOLUTION IMAGE */

.lightbox img {

    max-width: 95%;
    max-height: 95%;

    width: auto;
    height: auto;

    object-fit: contain;

    cursor: grab;

    user-select: none;

    transition: transform 0.15s ease;

}

.lightbox img:active {

    cursor: grabbing;

}


/* =========================
   CLOSE BUTTON
========================= */

.close {

    position: fixed;

    top: 20px;

    right: 30px;

    color: white;

    font-size: 45px;

    background: none;

    border: none;

    cursor: pointer;

    z-index: 10000;

}

.close:hover {

    opacity: 0.6;

}


/* =========================
   ZOOM CONTROLS
========================= */

.zoom-controls {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 10px;

    z-index: 10001;

}


.zoom-controls button {

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 8px;

    background: rgba(255,255,255,0.15);

    color: white;

    font-size: 24px;

    cursor: pointer;

}

.zoom-controls button:hover {

    background: rgba(255,255,255,0.3);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header h1 {

        font-size: 30px;

    }

    .gallery {

        width: 94%;

        grid-template-columns: 1fr;

    }

    .gallery img {

        height: 250px;

    }

    .lightbox {

        padding: 10px;

    }

    .zoom-controls {

        bottom: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>Branding</h1>

    <p>
        Logo Design & Branding.
    </p>

</header>



<!-- =========================
     GALLERY
========================= -->

<div class="gallery">


    <img
        src="images/branding/engraved logo.jpg"
        alt="Center Window"
        onclick="openImage(this.src)"
    >

   <img
        src="images/branding/LOGO.png"
        alt="Center Window"
        onclick="openImage(this.src)"
    >

   <img
        src="images/branding/R2A COLOR.jpg"
        alt="Center Window"
        onclick="openImage(this.src)"
    >




</div>



<!-- =========================
     FULLSCREEN
========================= -->

<div
    id="lightbox"
    class="lightbox"
    onclick="closeImage()"
>


    <!-- CLOSE BUTTON -->

    <button
        class="close"
        onclick="closeImage()"
    >
        &times;
    </button>


    <!-- FULL RESOLUTION IMAGE -->

    <img
        id="lightbox-image"
        src=""
        alt="Full Resolution"
        onclick="event.stopPropagation()"
    >


    <!-- ZOOM CONTROLS -->

    <div
        class="zoom-controls"
        onclick="event.stopPropagation()"
    >

        <button onclick="zoomIn()">+</button>

        <button onclick="zoomOut()">−</button>

        <button onclick="resetZoom()">⟳</button>

    </div>


</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>

let zoomLevel = 1;

let posX = 0;
let posY = 0;

let isDragging = false;

let startX = 0;
let startY = 0;


/* =========================
   OPEN IMAGE
========================= */

function openImage(imageSource) {

    const lightbox =
        document.getElementById("lightbox");

    const image =
        document.getElementById("lightbox-image");

    image.src = imageSource;

    lightbox.style.display = "flex";

    resetZoom();

}


/* =========================
   CLOSE IMAGE
========================= */

function closeImage() {

    document.getElementById("lightbox")
        .style.display = "none";

    document.getElementById("lightbox-image")
        .src = "";

    resetZoom();

}


/* =========================
   ZOOM IN
========================= */

function zoomIn() {

    zoomLevel += 0.25;

    if (zoomLevel > 5) {

        zoomLevel = 5;

    }

    updateZoom();

}


/* =========================
   ZOOM OUT
========================= */

function zoomOut() {

    zoomLevel -= 0.25;

    if (zoomLevel < 1) {

        zoomLevel = 1;

    }

    if (zoomLevel === 1) {

        posX = 0;
        posY = 0;

    }

    updateZoom();

}


/* =========================
   RESET ZOOM
========================= */

function resetZoom() {

    zoomLevel = 1;

    posX = 0;
    posY = 0;

    updateZoom();

}


/* =========================
   UPDATE ZOOM
========================= */

function updateZoom() {

    const image =
        document.getElementById("lightbox-image");

    image.style.transform =
        `translate(${posX}px, ${posY}px) scale(${zoomLevel})`;

}


/* =========================
   MOUSE WHEEL ZOOM
========================= */

document
.getElementById("lightbox-image")
.addEventListener("wheel", function(event) {

    event.preventDefault();

    if (event.deltaY < 0) {

        zoomIn();

    } else {

        zoomOut();

    }

});


/* =========================
   DRAG / PAN IMAGE
========================= */

const image =
    document.getElementById("lightbox-image");


image.addEventListener("mousedown", function(event) {

    if (zoomLevel <= 1) return;

    isDragging = true;

    startX = event.clientX - posX;

    startY = event.clientY - posY;

    image.style.transition = "none";

});


document.addEventListener("mousemove", function(event) {

    if (!isDragging) return;

    posX = event.clientX - startX;

    posY = event.clientY - startY;

    updateZoom();

});


document.addEventListener("mouseup", function() {

    isDragging = false;

    image.style.transition =
        "transform 0.15s ease";

});


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeImage();

    }

    if (event.key === "+" || event.key === "=") {

        zoomIn();

    }

    if (event.key === "-" || event.key === "_") {

        zoomOut();

    }

    if (event.key === "0") {

        resetZoom();

    }

});

</script>


</body>
